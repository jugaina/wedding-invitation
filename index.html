<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roumana ❤️ Sathik</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
  *{
      margin:0;
      padding:0;
      box-sizing:border-box;
  }

  body{
      background:#f8f3eb;
      overflow:hidden;
      font-family:Arial,sans-serif;
  }

  #container{
      width:100vw;
      height:100vh;
      position:relative;
      overflow:hidden;
      background:#f8f3eb;
  }

  .curtain{
      position:absolute;
      top:0;
      width:50%;
      height:100%;
      background:linear-gradient(to right,#5d0000,#8b0000,#b30000);
      transition:2s;
      z-index:10;
      pointer-events:none;
  }

  #left{
      left:0;
      border-right:3px solid gold;
  }

  #right{
      right:0;
      border-left:3px solid gold;
  }

  .content{
      position:absolute;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:#7b0000;
      z-index:20;
  }

  h1{
      font-family:'Great Vibes',cursive;
      font-size:70px;
      margin-bottom:15px;
  }

  h2{
      font-family:'Cinzel',serif;
      margin-bottom:20px;
  }

  button{
      margin-top:30px;
      padding:16px 40px;
      border:none;
      border-radius:40px;
      background:#8b0000;
      color:white;
      font-size:20px;
      cursor:pointer;
  }

  .openLeft{
      transform:translateX(-100%);
  }

  .openRight{
      transform:translateX(100%);
  }
  </style>
</head>

<body>

<div id="container">

<div id="left" class="curtain"></div>

<div id="right" class="curtain"></div>

<div class="content">

<h2>Wedding Invitation</h2>

<h1>Roumana Begam</h1>

<h2>&</h2>

<h1>Sathik Basha</h1>

<button onclick="openCurtain()">
Open Invitation
</button>

</div>

</div>

<script>

function openCurtain(){

document.getElementById("left").classList.add("openLeft");

document.getElementById("right").classList.add("openRight");

}

</script>

</body>
</html>
